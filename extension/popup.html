<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SolveSync</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header><span class="logo">⌁</span><strong>SolveSync</strong></header>
      <section aria-live="polite">
        <p id="connectionStatus" class="status">상태 확인 중...</p>
        <p id="deviceName" class="detail"></p>
        <p id="queueStatus" class="detail"></p>
        <p id="lastSync" class="detail"></p>
        <p id="lastError" class="error" hidden></p>
      </section>
      <button id="connectAccount" type="button" hidden>계정 연결</button>
      <button id="syncNow" type="button">지금 동기화</button>
      <button id="disconnectAccount" class="secondary danger" type="button" hidden>이 기기 연결 해제</button>
      <a href="options.html" target="_blank">연동 설정 열기</a>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
